<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Danbooru 下载管理器 · 滚动修复版</title>
    <style>
        :root {
            --bg: #f3ede2;
            --panel: rgba(255, 250, 243, 0.94);
            --panel-strong: #fffaf3;
            --line: #dbcab3;
            --ink: #2d2419;
            --muted: #766552;
            --accent: #b65434;
            --accent-deep: #8d3d23;
            --accent-soft: #f3dfd4;
        }
        /* ----- 全局基础样式 (强化滚动容器) ----- */
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; 
            margin: 0; 
            padding: 20px; 
            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 30%),
                linear-gradient(135deg, #f8f3eb, #ede2d1);
            color: var(--ink);
            overflow: hidden;          /* 防止页面整体滚动，所有滚动都在内部容器 */
        }

        /* 核心网格布局 */
        .dashboard {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            height: calc(100vh - 40px); /* 减去上下padding */
        }

        /* 左侧栏：必须允许内部收缩以支持滚动 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            min-width: 0;
            min-height: 0;              /* 关键：允许flex子项收缩至小于内容高度 */
        }

        /* 通用卡片样式 —— 所有flex列容器均设置 min-height:0 以启用滚动 */
        .card { 
            background: var(--panel); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid var(--line);
            box-shadow: 0 14px 30px rgba(87,58,25,0.10); 
            display: flex;
            flex-direction: column;
            min-height: 0;                /* 重要：允许内部内容滚动 */
        }

        .card h2 { 
            margin: 0 0 12px 0; 
            font-size: 1.1rem; 
            color: var(--ink); 
            border-left: 4px solid var(--accent); 
            padding-left: 10px; 
            flex-shrink: 0;
        }

        /* 控制面板行排版 */
        .row { 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            flex-shrink: 0;
        }
        
        label { 
            width: 100px; 
            flex-shrink: 0; 
            font-weight: bold; 
            font-size: 14px; 
            white-space: nowrap; 
        }

        input { 
            padding: 8px 12px; 
            border: 1px solid var(--line); 
            border-radius: 12px; 
            flex: 1; 
            min-width: 0; 
            background: rgba(255,255,255,0.92);
            color: var(--ink);
        }
        
        .btn-group { 
            display: flex; 
            gap: 10px; 
            margin-top: 5px; 
            flex-shrink: 0;
        }
        button { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            border-radius: 12px; 
            background: linear-gradient(135deg, var(--accent), var(--accent-deep)); 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background-color: #cbd5e0; cursor: not-allowed; transform: none; }
        .btn-pause { background: linear-gradient(135deg, #d48f2f, #b46e16); }
        .btn-resume { background: linear-gradient(135deg, #6d8b57, #4d6841); }
        .btn-stop { background: linear-gradient(135deg, #b64545, #8c2d2d); }

        /* ---------- 日志区域：强制显示滚动条，确保可滚动 ---------- */
        .log-container {
            flex: 1;                      /* 撑满卡片剩余空间 */
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
            border-radius: 14px;
            overflow: hidden;             /* 隐藏溢出，滚动由内部#log-box负责 */
            margin-top: 15px;
            min-height: 0;                 /* 允许收缩 */
        }

        #log-box { 
            flex: 1;                       /* 填满父容器高度 */
            overflow-y: scroll;             /* 强制垂直滚动条始终显示（即使内容少也显示轨道） */
            color: #d4d4d4; 
            padding: 12px; 
            font-family: 'Consolas', 'Monaco', monospace; 
            font-size: 12px; 
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            background: #1e1e1e;
            scrollbar-width: thin;          /* Firefox细滚动条 */
            scrollbar-color: #555 #2a2a2a;
        }
        /* WebKit 滚动条样式 (Chrome, Edge, Safari) */
        #log-box::-webkit-scrollbar {
            width: 8px;
            height: 8px;
            background: #2a2a2a;
        }
        #log-box::-webkit-scrollbar-track {
            background: #2a2a2a;
            border-radius: 10px;
        }
        #log-box::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 10px;
            border: 1px solid #3a3a3a;
        }
        #log-box::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        /* 右侧预览区头部 */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
            gap: 16px;
            flex-wrap: wrap;
        }
        .gallery-panel-title {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .gallery-tabs {
            display: inline-flex;
            padding: 4px;
            background: rgba(219, 202, 179, 0.38);
            border-radius: 999px;
            border: 1px solid rgba(219, 202, 179, 0.8);
        }
        .gallery-tab {
            flex: none;
            min-width: 120px;
            padding: 8px 16px;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
        }
        .gallery-tab:hover {
            transform: none;
            opacity: 0.95;
        }
        .gallery-tab.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: white;
            box-shadow: 0 10px 20px rgba(182, 84, 52, 0.18);
        }

        /* 搜索框美化 */
        .search-wrapper {
            position: relative;
            width: 280px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 8px 12px 8px 35px;
            border-radius: 20px;
            border: 1px solid var(--line);
            font-size: 13px;
            transition: 0.3s;
            background: rgba(255,255,255,0.92);
        }
        .search-wrapper input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(182, 84, 52, 0.15);
        }
        .search-wrapper::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
        }

        /* ---------- 图片预览网格容器：强制滚动条，统一细条风格 ---------- */
        .gallery-container {
            flex: 1;                       /* 占满剩余高度 */
            overflow-y: scroll;              /* 强制垂直滚动条始终显示 */
            padding-right: 5px;
            min-height: 0;                   /* 允许收缩 */
            scrollbar-width: thin;
            scrollbar-color: #c0c0c0 #f0f0f0;
        }
        .gallery-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
            background: #f0f0f0;
        }
        .gallery-container::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }
        .gallery-container::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 10px;
            border: 1px solid #f0f0f0;
        }
        .gallery-container::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 15px; 
        }
        .gallery-empty {
            padding: 40px 16px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 18px;
            background: rgba(255,255,255,0.55);
        }
        .gallery-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .pagination {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .pagination button {
            flex: none;
            min-width: 88px;
        }
        .page-info {
            color: var(--muted);
            font-size: 13px;
        }

        .img-card { 
            background: var(--panel-strong); 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 10px 20px rgba(87,58,25,0.10);
            transition: 0.3s;
            border: 1px solid rgba(74,53,25,0.08);
            animation: fadeIn 0.4s ease forwards;
            display: flex;
            flex-direction: column;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .img-card:hover { transform: translateY(-5px); box-shadow: 0 16px 28px rgba(87,58,25,0.16); }
        .img-card img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            display: block; 
            background: #f8f8f8; 
            cursor: zoom-in; 
        }
        .image-trigger {
            display: block;
            width: 100%;
            padding: 0;
            margin: 0;
            border: none;
            background: transparent;
            cursor: zoom-in;
        }
        .image-trigger:hover {
            transform: none;
            opacity: 1;
        }
        .file-thumb {
            object-fit: contain !important;
            padding: 18px;
            background:
                linear-gradient(135deg, #f6ecdf, #ead8bf);
        }
        
        .img-info { 
            font-size: 12px; 
            padding: 10px; 
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .img-info b { 
            display: block; 
            color: #333; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
            margin-bottom: 4px; 
        }
        .card-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .card-link {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            text-decoration: none;
            font-size: 11px;
            font-weight: bold;
            transition: 0.2s;
        }
        .card-link.origin {
            color: #2196F3;
            background: #eaf4ff;
        }
        .card-link.edit {
            color: white;
            background: #ff7043;
        }
        .card-link:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        /* ---------- 角色标签横向滚动容器 (细条可见) ---------- */
        .tags-scroll-container {
            display: flex;
            overflow-x: auto;        /* 横向滚动 */
            gap: 5px;
            padding: 5px 2px;
            margin: 5px 0;
            scrollbar-width: thin;   /* Firefox */
            scrollbar-color: #b0b0b0 #f0f0f0;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }
        .tags-scroll-container::-webkit-scrollbar {
            height: 5px;             /* 水平滚动条高度 */
            background: #f0f0f0;
        }
        .tags-scroll-container::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 10px;
        }
        .tags-scroll-container::-webkit-scrollbar-thumb {
            background: #b0b0b0;
            border-radius: 10px;
        }
        .tags-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #909090;
        }

        /* 单个角色标签样式 */
        .char-tag {
            flex: 0 0 auto;          /* 不压缩宽度 */
            background: #f0f2f5;
            color: #666;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            border: 1px solid #e0e0e0;
            user-select: none;
            line-height: 1.4;
        }

        .char-tag:hover {
            background: #2196F3;
            color: white;
            border-color: #2196F3;
        }

        /* 特殊标记 original 类型 */
        .char-tag.original {
            cursor: default;
            font-style: italic;
            border: none;
            background: #f0f2f5;
            color: #999;
        }
        .char-tag.original:hover {
            background: #f0f2f5;
            color: #999;
            border: none;
        }

        #proxy-status { font-size: 12px; margin-left: 10px; font-weight: normal; }

        .viewer-modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            background: rgba(24, 17, 11, 0.82);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }
        .viewer-modal.open {
            opacity: 1;
            pointer-events: auto;
        }
        .viewer-dialog {
            position: relative;
            width: min(1460px, calc(100vw - 24px));
            height: min(94vh, 1180px);
            background: rgba(255, 250, 243, 0.98);
            border: 1px solid rgba(219, 202, 179, 0.8);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .viewer-stage {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 20px 72px;
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.92), rgba(255,250,243,0.75) 35%, rgba(232,218,197,0.88));
            scrollbar-width: thin;
            scrollbar-color: #b79d7d rgba(255,255,255,0.45);
        }
        .viewer-stage::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .viewer-stage::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.45);
            border-radius: 999px;
        }
        .viewer-stage::-webkit-scrollbar-thumb {
            background: #b79d7d;
            border-radius: 999px;
        }
        .viewer-image {
            display: block;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 18px;
            box-shadow: 0 18px 48px rgba(68, 47, 21, 0.18);
            background: rgba(255, 255, 255, 0.72);
        }
        .viewer-caption {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 10px 16px 12px;
            border-top: 1px solid rgba(219, 202, 179, 0.7);
            background: rgba(255, 248, 238, 0.98);
        }
        .viewer-meta {
            min-width: 0;
        }
        .viewer-title {
            margin: 0;
            font-size: 1rem;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .viewer-counter {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }
        .viewer-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .viewer-btn {
            flex: none;
            min-width: 68px;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 10px;
        }
        .viewer-link-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #ff7043, #d85a2f);
        }
        .viewer-open-btn {
            background: linear-gradient(135deg, #6d8b57, #4d6841);
        }
        .viewer-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 42px;
            height: 42px;
            border-radius: 999px;
            padding: 0;
            font-size: 24px;
            line-height: 1;
            z-index: 2;
        }
        .viewer-close:hover {
            transform: none;
        }
        .viewer-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border-radius: 999px;
            padding: 0;
            font-size: 24px;
            line-height: 1;
            z-index: 2;
        }
        .viewer-nav:hover {
            transform: translateY(-50%);
        }
        .viewer-btn:hover {
            transform: none;
        }
        .viewer-prev { left: 14px; }
        .viewer-next { right: 14px; }

        @media (max-width: 900px) {
            .viewer-modal {
                padding: 16px;
            }
            .viewer-dialog {
                width: min(100%, calc(100vw - 16px));
                height: min(95vh, 980px);
            }
            .viewer-stage {
                padding: 60px 14px 14px;
            }
            .viewer-caption {
                flex-direction: column;
                align-items: stretch;
            }
            .viewer-actions {
                width: 100%;
            }
            .viewer-btn {
                flex: 1;
            }
            .viewer-nav {
                top: auto;
                bottom: 68px;
                transform: none;
                width: 42px;
                height: 42px;
            }
            .viewer-prev { left: 18px; }
            .viewer-next { right: 18px; }
            .viewer-nav:hover {
                transform: none;
            }
        }

        /* 全局滚动条美化 (作为后备) */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- 左侧：控制面板 + 日志 -->
    <div class="sidebar">
        <div class="card">
            <h2>控制面板</h2>
            <div class="row" style="margin-top: 5px;">
                <button onclick="checkProxy()" style="flex: none; width: auto; padding: 6px 12px; font-size: 12px;">检查代理</button>
                <span id="proxy-status">状态: 未知</span>
            </div>
            <div class="row">
                <label>页码范围</label>
                <input type="number" id="start-page" value="1" min="1">
                <span style="margin: 0 8px; color: #999;">至</span>
                <input type="number" id="end-page" value="16" min="1">
            </div>
            <div class="row">
                <label>过滤 Tags</label>
                <input type="text" id="filter-tags" value="furry, futanari" placeholder="逗号分隔">
            </div>
            <div class="btn-group">
                <button id="btn-start" onclick="startTask()">▶ 开始抓取</button>
                <button id="btn-pause" class="btn-pause" onclick="pauseTask()" disabled>⏸ 暂停</button>
                <button id="btn-resume" class="btn-resume" onclick="resumeTask()" disabled>⏯ 继续</button>
                <button id="btn-stop" class="btn-stop" onclick="stopTask()" disabled>⏹ 强制结束</button>
            </div>
            <div class="btn-group">
                <a id="mosaic-home-link" href="/mosaic" target="_blank" rel="noopener noreferrer" style="display:block; width:100%; text-align:center; text-decoration:none; padding:10px 12px; border-radius:12px; background:linear-gradient(135deg, #8d3d23, #b65434); color:white; font-weight:bold;">使用马赛克编辑</a>
            </div>
        </div>

        <div class="card" style="flex: 1;">
            <h2>实时日志</h2>
            <div class="log-container">
                <div id="log-box">等待任务启动...</div>
            </div>
        </div>
    </div>

    <!-- 右侧：预览区 -->
    <div class="card" style="flex: 1; min-height: 0;">   <!-- 明确允许收缩 -->
        <div class="content-header">
            <div class="gallery-panel-title">
                <h2 id="gallery-title">最新抓取预览</h2>
                <div class="gallery-tabs">
                    <button id="tab-latest" class="gallery-tab active" type="button">最新抓取预览</button>
                    <button id="tab-local" class="gallery-tab" type="button">本地已下载</button>
                </div>
            </div>
            <div class="search-wrapper">
                <input type="text" id="char-search" placeholder="在当前栏目中搜索角色 (例如: hatsune_miku)">
            </div>
        </div>
        
        <div class="gallery-container">
            <div id="image-gallery" class="gallery"></div>
        </div>
        <div class="gallery-footer">
            <div id="gallery-count" class="page-info">共 0 张</div>
            <div class="pagination">
                <button id="page-prev" type="button">上一页</button>
                <span id="page-info" class="page-info">第 1 / 1 页</span>
                <button id="page-next" type="button">下一页</button>
            </div>
        </div>
    </div>
</div>

<div id="viewer-modal" class="viewer-modal" aria-hidden="true">
    <div class="viewer-dialog" role="dialog" aria-modal="true" aria-label="图片预览">
        <button id="viewer-close" class="viewer-close" type="button" aria-label="关闭预览">×</button>
        <button id="viewer-prev" class="viewer-nav viewer-prev" type="button" aria-label="上一张">‹</button>
        <button id="viewer-next" class="viewer-nav viewer-next" type="button" aria-label="下一张">›</button>
        <div class="viewer-stage">
            <img id="viewer-image" class="viewer-image" src="" alt="预览图片">
        </div>
        <div class="viewer-caption">
            <div class="viewer-meta">
                <p id="viewer-title" class="viewer-title">图片预览</p>
                <div id="viewer-counter" class="viewer-counter">0 / 0</div>
            </div>
            <div class="viewer-actions">
                <button id="viewer-prev-bottom" class="viewer-btn" type="button">上一张</button>
                <button id="viewer-next-bottom" class="viewer-btn" type="button">下一张</button>
                <button id="viewer-open-local-bottom" class="viewer-btn viewer-open-btn" type="button">打开本地</button>
                <a id="viewer-edit-bottom" class="viewer-btn viewer-link-btn" href="/mosaic" target="_blank" rel="noopener noreferrer">编辑打码</a>
                <button id="viewer-close-bottom" class="viewer-btn" type="button">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const ITEMS_PER_PAGE = 30;
        const DEFAULT_SERVER_BASE = 'http://127.0.0.1:8000';
        const SERVER_BASE = window.location.protocol === 'file:' ? DEFAULT_SERVER_BASE : window.location.origin;

        const gallery = document.getElementById('image-gallery');
        const galleryTitle = document.getElementById('gallery-title');
        const galleryCount = document.getElementById('gallery-count');
        const pageInfo = document.getElementById('page-info');
        const pagePrev = document.getElementById('page-prev');
        const pageNext = document.getElementById('page-next');
        const tabLatest = document.getElementById('tab-latest');
        const tabLocal = document.getElementById('tab-local');
        const charSearch = document.getElementById('char-search');
        const logBox = document.getElementById('log-box');
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnResume = document.getElementById('btn-resume');
        const btnStop = document.getElementById('btn-stop');
        const proxyStatus = document.getElementById('proxy-status');
        const mosaicHomeLink = document.getElementById('mosaic-home-link');
        const viewerModal = document.getElementById('viewer-modal');
        const viewerStage = viewerModal.querySelector('.viewer-stage');
        const viewerImage = document.getElementById('viewer-image');
        const viewerTitle = document.getElementById('viewer-title');
        const viewerCounter = document.getElementById('viewer-counter');
        const viewerPrev = document.getElementById('viewer-prev');
        const viewerNext = document.getElementById('viewer-next');
        const viewerClose = document.getElementById('viewer-close');
        const viewerPrevBottom = document.getElementById('viewer-prev-bottom');
        const viewerNextBottom = document.getElementById('viewer-next-bottom');
        const viewerOpenLocalBottom = document.getElementById('viewer-open-local-bottom');
        const viewerEditBottom = document.getElementById('viewer-edit-bottom');
        const viewerCloseBottom = document.getElementById('viewer-close-bottom');

        const galleryState = {
            latest: [],
            local: [],
            activeTab: 'latest',
            currentPage: 1
        };
        let currentViewerIndex = -1;

        const IMAGE_EXTENSIONS = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'avif']);

        function getFileExtension(path) {
            const raw = (path || '').split('?')[0].split('#')[0];
            const parts = raw.split('.');
            return parts.length > 1 ? parts.pop().toLowerCase() : '';
        }

        function buildPlaceholderDataUrl(label) {
            const safeLabel = (label || 'FILE').toUpperCase().slice(0, 8);
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
                    <defs>
                        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#f7ede2"/>
                            <stop offset="100%" stop-color="#e2c9a6"/>
                        </linearGradient>
                    </defs>
                    <rect width="800" height="800" rx="48" fill="url(#g)"/>
                    <rect x="72" y="72" width="656" height="656" rx="38" fill="rgba(255,255,255,0.52)" stroke="rgba(141,61,35,0.22)" stroke-width="6"/>
                    <text x="400" y="430" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="140" font-weight="700" fill="#8d3d23">${safeLabel}</text>
                </svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        }

        function buildUrl(path) {
            if (!path) return '';
            if (/^https?:\/\//i.test(path)) return path;
            if (path.startsWith('/')) return `${SERVER_BASE}${path}`;
            return `${SERVER_BASE}/${path}`;
        }

        async function apiFetch(path, options) {
            return fetch(`${SERVER_BASE}${path}`, options);
        }

        function appendLog(msg) {
            if (logBox.innerText === '等待任务启动...') {
                logBox.innerText = '';
            }
            logBox.textContent += msg + '\n';
            setTimeout(() => {
                logBox.scrollTop = logBox.scrollHeight;
            }, 10);
            requestAnimationFrame(() => {
                logBox.scrollTop = logBox.scrollHeight;
            });
        }

        function normalizeImageData(imgData) {
            const imageSrc = buildUrl(imgData.web_url || imgData.file_url || 'https://via.placeholder.com/300?text=No+Image');
            const artist = imgData.artist || '未知';
            const filename = imgData.filename || `${artist || 'image'}.png`;
            const localPath = imgData.local_path || '';
            const tags = imgData.tags || {};
            const charString = tags.tag_string_character || '';
            const encodedImage = encodeURIComponent(imageSrc);
            const encodedName = encodeURIComponent(filename);
            const extension = getFileExtension(filename || localPath || imageSrc) || 'FILE';
            const isImage = IMAGE_EXTENSIONS.has(extension);

            return {
                ...imgData,
                artist,
                filename,
                local_path: localPath,
                web_url: imageSrc,
                post_url: imgData.post_url || '#',
                tags,
                characters: charString,
                mosaicUrl: `${SERVER_BASE}/mosaic?image_url=${encodedImage}&image_name=${encodedName}`,
                isImage,
                previewSrc: isImage ? imageSrc : buildPlaceholderDataUrl(extension),
                fileExtensionLabel: extension.toUpperCase()
            };
        }

        function mergeUniqueByUrl(existing, incoming) {
            const map = new Map(existing.map(item => [item.web_url, item]));
            incoming.map(normalizeImageData).forEach(item => {
                map.set(item.web_url, { ...(map.get(item.web_url) || {}), ...item });
            });
            return Array.from(map.values()).sort((a, b) => b.web_url.localeCompare(a.web_url));
        }

        function getActiveItems() {
            return galleryState[galleryState.activeTab];
        }

        function getFilteredItems() {
            const query = charSearch.value.toLowerCase().trim();
            const items = getActiveItems();
            if (!query) return items;
            return items.filter(item => (item.characters || '').toLowerCase().includes(query));
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'img-card';
            card.dataset.characters = (item.characters || '').toLowerCase();
            card.dataset.imageSrc = item.web_url;
            card.dataset.artist = item.artist;
            card.dataset.mosaicUrl = item.mosaicUrl;
            card.dataset.previewSrc = item.previewSrc;
            card.dataset.isImage = item.isImage ? '1' : '0';
            card.dataset.localPath = item.local_path || '';

            const charArray = (item.characters || '').split(' ').filter(Boolean);
            let tagsHtml = '';
            if (charArray.length) {
                charArray.forEach(char => {
                    const safeChar = char.replace(/"/g, '&quot;');
                    tagsHtml += `<span class="char-tag" data-char="${safeChar}" title="点击复制: ${char}">${char}</span>`;
                });
            } else {
                tagsHtml = '<span class="char-tag original" data-char="original">original</span>';
            }

            card.innerHTML = `
                <button class="image-trigger" type="button" aria-label="预览图片">
                    <img src="${item.previewSrc}" loading="lazy" title="画师: ${item.artist}" class="${item.isImage ? '' : 'file-thumb'}">
                </button>
                <div class="img-info">
                    <b title="${item.artist}">${item.artist}</b>
                    <div class="tags-scroll-container">
                        ${tagsHtml}
                    </div>
                    <div class="card-actions">
                        <a href="${item.post_url || '#'}" target="_blank" rel="noopener noreferrer" class="card-link origin">查看原贴</a>
                        <a href="${item.mosaicUrl}" target="_blank" rel="noopener noreferrer" class="card-link edit">编辑打码</a>
                    </div>
                </div>
            `;
            return card;
        }

        function getVisibleCards() {
            return Array.from(gallery.getElementsByClassName('img-card'));
        }

        function renderGallery() {
            const filteredItems = getFilteredItems();
            const totalPages = Math.max(1, Math.ceil(filteredItems.length / ITEMS_PER_PAGE));
            if (galleryState.currentPage > totalPages) {
                galleryState.currentPage = totalPages;
            }
            const startIndex = (galleryState.currentPage - 1) * ITEMS_PER_PAGE;
            const pageItems = filteredItems.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            gallery.innerHTML = '';
            if (!pageItems.length) {
                gallery.innerHTML = '<div class="gallery-empty">当前栏目没有可显示的图片</div>';
            } else {
                pageItems.forEach(item => gallery.appendChild(createCard(item)));
            }

            galleryTitle.textContent = galleryState.activeTab === 'latest' ? '最新抓取预览' : '本地已下载';
            galleryCount.textContent = `共 ${filteredItems.length} 张`;
            pageInfo.textContent = `第 ${galleryState.currentPage} / ${totalPages} 页`;
            pagePrev.disabled = galleryState.currentPage <= 1;
            pageNext.disabled = galleryState.currentPage >= totalPages;
            tabLatest.classList.toggle('active', galleryState.activeTab === 'latest');
            tabLocal.classList.toggle('active', galleryState.activeTab === 'local');

            if (viewerModal.classList.contains('open')) {
                const currentSrc = viewerImage.getAttribute('src');
                const visibleCards = getVisibleCards();
                if (!visibleCards.length) {
                    closeViewer();
                } else {
                    const currentIndex = visibleCards.findIndex(card => card.dataset.imageSrc === currentSrc);
                    renderViewer(currentIndex >= 0 ? currentIndex : 0);
                }
            }
        }

        function switchTab(tabName) {
            galleryState.activeTab = tabName;
            galleryState.currentPage = 1;
            renderGallery();
        }

        function applyViewerImageSize() {
            const naturalWidth = viewerImage.naturalWidth;
            const naturalHeight = viewerImage.naturalHeight;
            if (!naturalWidth || !naturalHeight) return;

            viewerImage.style.width = '';
            viewerImage.style.height = '';
            if (naturalWidth >= naturalHeight) {
                viewerImage.style.height = '1280px';
            } else {
                viewerImage.style.width = '1280px';
            }
        }

        function resetViewerScroll() {
            viewerStage.scrollTop = 0;
            viewerStage.scrollLeft = 0;
        }

        function closeViewer() {
            viewerModal.classList.remove('open');
            viewerModal.setAttribute('aria-hidden', 'true');
            viewerImage.src = '';
            viewerImage.style.width = '';
            viewerImage.style.height = '';
            viewerImage.classList.remove('file-thumb');
            currentViewerIndex = -1;
            document.body.style.overflow = 'hidden';
        }

        function renderViewer(index) {
            const cards = getVisibleCards();
            if (!cards.length) {
                closeViewer();
                return;
            }

            const safeIndex = Math.max(0, Math.min(index, cards.length - 1));
            const card = cards[safeIndex];
            currentViewerIndex = safeIndex;
            viewerImage.src = card.dataset.isImage === '1' ? card.dataset.imageSrc : card.dataset.previewSrc;
            viewerImage.classList.toggle('file-thumb', card.dataset.isImage !== '1');
            viewerImage.alt = card.dataset.artist || '未知';
            viewerTitle.textContent = card.dataset.artist || '未知';
            viewerCounter.textContent = `${safeIndex + 1} / ${cards.length}`;
            viewerEditBottom.href = card.dataset.mosaicUrl || `${SERVER_BASE}/mosaic`;
            viewerPrev.disabled = safeIndex === 0;
            viewerPrevBottom.disabled = safeIndex === 0;
            viewerNext.disabled = safeIndex === cards.length - 1;
            viewerNextBottom.disabled = safeIndex === cards.length - 1;
            resetViewerScroll();

            if (viewerImage.complete) {
                applyViewerImageSize();
            }
        }

        function openViewerByCard(card) {
            const cards = getVisibleCards();
            const index = cards.indexOf(card);
            if (index === -1) return;

            viewerModal.classList.add('open');
            viewerModal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            renderViewer(index);
        }

        function showPreviousImage() {
            if (currentViewerIndex > 0) {
                renderViewer(currentViewerIndex - 1);
            }
        }

        function showNextImage() {
            const cards = getVisibleCards();
            if (currentViewerIndex >= 0 && currentViewerIndex < cards.length - 1) {
                renderViewer(currentViewerIndex + 1);
            }
        }

        function updateButtons(isRunning, isPaused) {
            btnStart.disabled = isRunning;
            btnPause.disabled = !isRunning || isPaused;
            btnResume.disabled = !isRunning || !isPaused;
            btnStop.disabled = !isRunning;
        }

        async function checkProxy() {
            proxyStatus.innerText = '正在检查...';
            proxyStatus.style.color = '';
            try {
                const res = await apiFetch('/api/proxy_check');
                if (!res.ok) throw new Error('网络响应异常');
                const data = await res.json();
                proxyStatus.innerText = data.msg || '未知';
                if (data.color === 'green') proxyStatus.style.color = '#4caf50';
                else if (data.color === 'orange') proxyStatus.style.color = '#ff9800';
                else proxyStatus.style.color = '#f44336';
            } catch (e) {
                proxyStatus.innerText = '请求失败';
                proxyStatus.style.color = '#f44336';
            }
        }

        async function startTask() {
            const startP = document.getElementById('start-page').value;
            const endP = document.getElementById('end-page').value;
            const tags = document.getElementById('filter-tags').value;
            try {
                await apiFetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        start_page: parseInt(startP, 10) || 1,
                        end_page: parseInt(endP, 10) || 16,
                        tags
                    })
                });
            } catch (e) {
                appendLog('启动任务请求失败: ' + e.message);
            }
        }

        async function pauseTask() {
            try {
                await apiFetch('/api/pause', { method: 'POST' });
            } catch (e) {
                appendLog('暂停失败');
            }
        }

        async function resumeTask() {
            try {
                await apiFetch('/api/resume', { method: 'POST' });
            } catch (e) {
                appendLog('继续失败');
            }
        }

        async function stopTask() {
            try {
                await apiFetch('/api/stop', { method: 'POST' });
            } catch (e) {
                appendLog('强制结束失败: ' + e.message);
            }
        }

        async function openCurrentLocalFile() {
            const cards = getVisibleCards();
            if (currentViewerIndex < 0 || currentViewerIndex >= cards.length) {
                appendLog('当前没有可打开的本地文件');
                return;
            }
            const localPath = cards[currentViewerIndex].dataset.localPath;
            if (!localPath) {
                appendLog('当前图片缺少本地路径');
                return;
            }
            try {
                const res = await apiFetch('/api/open_local', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ local_path: localPath })
                });
                const data = await res.json();
                appendLog(data.msg || '已尝试打开本地文件');
            } catch (e) {
                appendLog('打开本地文件失败: ' + e.message);
            }
        }

        async function loadInitialGalleryData() {
            try {
                const res = await apiFetch('/api/gallery_data');
                if (!res.ok) throw new Error('加载图库数据失败');
                const data = await res.json();
                galleryState.latest = (data.latest_images || []).map(normalizeImageData).reverse();
                galleryState.local = (data.local_images || []).map(normalizeImageData);
                renderGallery();
            } catch (e) {
                appendLog('加载图库失败: ' + e.message);
                if (window.location.protocol === 'file:') {
                    appendLog('当前像是直接打开了 html，请先运行 python main.py，然后访问 http://127.0.0.1:8000');
                }
            }
        }

        function setupTagCopyDelegation() {
            gallery.addEventListener('click', function(e) {
                const tag = e.target.closest('.char-tag');
                if (!tag || tag.classList.contains('original')) return;

                e.preventDefault();
                e.stopPropagation();
                const charName = tag.dataset.char;
                if (!charName) return;

                navigator.clipboard.writeText(charName).then(() => {
                    tag.innerText = '已复制';
                    tag.style.backgroundColor = '#4caf50';
                    tag.style.color = 'white';
                    setTimeout(() => {
                        tag.innerText = charName;
                        tag.style.backgroundColor = '';
                        tag.style.color = '';
                    }, 800);
                }).catch(err => {
                    console.warn('复制失败', err);
                });
            });
        }

        function setupViewerDelegation() {
            gallery.addEventListener('click', function(e) {
                const trigger = e.target.closest('.image-trigger');
                if (!trigger) return;
                e.preventDefault();
                const card = trigger.closest('.img-card');
                if (card) openViewerByCard(card);
            });

            viewerPrev.addEventListener('click', showPreviousImage);
            viewerPrevBottom.addEventListener('click', showPreviousImage);
            viewerNext.addEventListener('click', showNextImage);
            viewerNextBottom.addEventListener('click', showNextImage);
            viewerClose.addEventListener('click', closeViewer);
            viewerCloseBottom.addEventListener('click', closeViewer);
            viewerOpenLocalBottom.addEventListener('click', openCurrentLocalFile);
            viewerModal.addEventListener('click', function(e) {
                if (e.target === viewerModal) closeViewer();
            });
            document.addEventListener('keydown', function(e) {
                if (!viewerModal.classList.contains('open')) return;
                if (e.key === 'Escape') closeViewer();
                if (e.key === 'ArrowLeft') showPreviousImage();
                if (e.key === 'ArrowRight') showNextImage();
            });
            viewerImage.addEventListener('load', function() {
                applyViewerImageSize();
                resetViewerScroll();
            });
        }

        function setupPaginationAndTabs() {
            tabLatest.addEventListener('click', function() {
                switchTab('latest');
            });
            tabLocal.addEventListener('click', function() {
                switchTab('local');
            });
            pagePrev.addEventListener('click', function() {
                if (galleryState.currentPage > 1) {
                    galleryState.currentPage -= 1;
                    renderGallery();
                }
            });
            pageNext.addEventListener('click', function() {
                const totalPages = Math.max(1, Math.ceil(getFilteredItems().length / ITEMS_PER_PAGE));
                if (galleryState.currentPage < totalPages) {
                    galleryState.currentPage += 1;
                    renderGallery();
                }
            });
            charSearch.addEventListener('input', function() {
                galleryState.currentPage = 1;
                renderGallery();
            });
        }

        window.checkProxy = checkProxy;
        window.startTask = startTask;
        window.pauseTask = pauseTask;
        window.resumeTask = resumeTask;
        window.stopTask = stopTask;

        mosaicHomeLink.href = `${SERVER_BASE}/mosaic`;
        viewerEditBottom.href = `${SERVER_BASE}/mosaic`;

        const polling = setInterval(async function() {
            try {
                const res = await apiFetch('/api/status');
                if (!res.ok) return;
                const data = await res.json();
                if (data.new_logs?.length) {
                    data.new_logs.forEach(log => appendLog(log));
                }
                if (data.new_images?.length) {
                    galleryState.latest = mergeUniqueByUrl(galleryState.latest, data.new_images);
                    galleryState.local = mergeUniqueByUrl(galleryState.local, data.new_images);
                    renderGallery();
                }
                updateButtons(data.is_running, data.is_paused);
            } catch (e) {
                // 静默失败
            }
        }, 1000);

        setupTagCopyDelegation();
        setupViewerDelegation();
        setupPaginationAndTabs();
        loadInitialGalleryData();
        appendLog('界面已加载。');

        window.addEventListener('beforeunload', function() {
            clearInterval(polling);
        });
    })();
</script>

</body>
</html>
